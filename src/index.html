    <a-entity id="portalSpawn" visible="false" gltf-model="#portal" position="1.39 0 -19.8" teleport></a-entity>

      <a-entity id="camera" camera="active: true"></a-entity>
      <a-entity id="particles" position="0 -2 -3" rotation="0 180 0"
        particle-system="color: #EF0000,#44CC00; rotationAngle: 1.5; rotationAngleSpread: 0.3; size: 1.5; maxAge: 1;">

    </a-entity>
