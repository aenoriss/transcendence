<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="ie=edge">
  <title>Transcendence</title>
</head>

<body>
  <a-scene vr-mode-ui="enabled: false">
    <a-assets>
      <a-asset-item id="map1" src="bg01.gltf"></a-asset-item>
      <a-asset-item id="avatar" src="avatar.gltf"></a-asset-item>
      <a-asset-item id="portal" src="portal.gltf"></a-asset-item>
      <img id="sky" src="../sky.png">


    </a-assets>

    <a-entity gltf-model="#map1"></a-entity>
    <a-sky src="#sky"></a-sky>

    <a-sphere color="yellow" radius="5" id="portal1"  position="32 4 15"  teleport></a-sphere>
    <a-sphere color="red" radius="5" id="portal2"  position="60 4 -30"  teleport></a-sphere>
    <a-sphere color="green" radius="5" id="portal3"  position="10 4 -20"  teleport></a-sphere>
    <a-sphere color="blue" radius="5" id="portal4"  position="32 4 -60" teleport></a-sphere>

    <a-entity id="rig" movement-controls="speed: 0.8"  rotation="0 180 0" position="0 3 0" look-controls movementDetector >
      <a-entity gltf-model="#avatar" scale="0.002 0.002 0.002" rotation="0 90 0" position="0 -1 -2" animation-mixer="clip:animation_0"></a-entity>
      <a-entity id="camera" camera="active: true"></a-entity>
      <a-entity id="particles" position="0 -2 -3" rotation="0 180 0" particle-system="color: #EF0000,#44CC00; rotationAngle: 1.5; rotationAngleSpread: 0.3; size: 1.5; maxAge: 1;"></a-entity>
    </a-entity>


  </a-scene>
</body>

</html>
